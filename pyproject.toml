[project]
name = "sheet2app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "google-genai>=1.0",
  "openai>=1.40",  # OpenAI-compatible providers, e.g. Meta Muse Spark
  "python-dotenv>=1.0",
  # API + Supabase (Person B)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.9",
  "supabase>=2.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
